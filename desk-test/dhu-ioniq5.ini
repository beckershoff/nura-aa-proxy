; Desktop Head Unit profile approximating the Ioniq 5 (EU 2021-2023) 12.3" centre display, 1920x720.
; Android Auto only streams 800x480 / 1280x720 / 1920x1080; wide screens use 1080p video with
; margins: 1080 - 720 = 360 px not shown. dpi/framerate are guesses (DHU defaults) until we
; log the car's real service-discovery values through aa-proxy-rs.
; Usage: ./desktop-head-unit --usb -c <repo>/desk-test/dhu-ioniq5.ini
[general]
touch = true
touchpad = false
controller = false
instrumentcluster = false
resolution = 1920x1080
marginheight = 360
dpi = 160
framerate = 30

[sensors]
location = true
night_mode = true
driving_status = true
